<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=YOUR_GAME_ID">

  <!-- SEO-friendly fallback -->
  <link rel="canonical" href="https://play.google.com/store/apps/details?id=YOUR_GAME_ID">

  <title>Redirecting…</title>

  <!-- JS fallback -->
  <script>
    window.location.replace(
      "https://play.google.com/store/apps/details?id=YOUR_GAME_ID"
    );
  </script>
</head>
<body>
  <p>
    Redirecting to Google Play…
    <a href="https://play.google.com/store/apps/details?id=YOUR_GAME_ID">
      Click here if not redirected
    </a>
  </p>
</body>
</html>
